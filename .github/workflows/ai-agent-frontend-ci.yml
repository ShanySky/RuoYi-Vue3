name: AI Agent Frontend CI

on:
  push:
    branches:
      - chatgpt/ai-agent-assistant
      - chatgpt/ai-agent-hardening-phase35-p0
      - chatgpt/ai-agent-phase35-p1-closure
      - chatgpt/ai-settings-boundary-closure
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate Capability Contract v1
        run: node tests/ai-capability-contract.test.mjs
      - name: Validate AI settings boundary contract
        run: node tests/ai-settings-boundary.test.mjs
      - name: Install dependencies
        run: npm install
      - name: Production build
        run: npm run build:prod
