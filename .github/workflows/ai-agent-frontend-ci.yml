name: AI Agent Frontend CI

on:
  push:
    branches:
      - chatgpt/ai-agent-assistant
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Production build
        run: npm run build:prod
